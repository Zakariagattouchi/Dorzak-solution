              if test -n "$id"; then printf '%s\n' "$id" | grep -Eq '^[0-9a-f]{64}$'; fi
            fi
            remove_exact_container "$container_name" "$id"
            if test -e "$cidfile"; then
              rm -f "$cidfile"
            fi
            rm -f "$namefile"
